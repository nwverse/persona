<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Persona</title>
  <link rel="stylesheet" href="island.css">
</head>
<body>
  <!-- The island at the MacBook notch (#7669): the most urgent category on the left, the next on the right, the notch
       between them; the list of rows while the pointer is over it. The shell sends what to draw (island-preload.cts). -->
  <svg class="symbols" aria-hidden="true">
    <symbol id="needs_you" viewBox="0 0 16 16"><path d="M8 1.5c-3.6 0-6.5 2.4-6.5 5.4 0 1.7.9 3.2 2.4 4.2L3.4 14l3.1-1.8c.5.1 1 .1 1.5.1 3.6 0 6.5-2.4 6.5-5.4S11.6 1.5 8 1.5Z"/></symbol>
    <symbol id="working" viewBox="0 0 16 16"><path d="M9.2 1.3l.4 1.6c.5.2.9.4 1.3.7l1.6-.5 1.2 2-1.2 1.2c.1.5.1 1 0 1.5l1.2 1.2-1.2 2-1.6-.5c-.4.3-.8.5-1.3.7l-.4 1.6H6.8l-.4-1.6c-.5-.2-.9-.4-1.3-.7l-1.6.5-1.2-2 1.2-1.2c-.1-.5-.1-1 0-1.5L2.3 5.1l1.2-2 1.6.5c.4-.3.8-.5 1.3-.7l.4-1.6h2.4ZM8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8Z"/></symbol>
    <symbol id="unread" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.5"/></symbol>
  </svg>
  <main id="island" role="group" data-open="no" data-notch="no">
    <div class="bar">
      <span id="left" class="side" hidden></span>
      <span class="notch" aria-hidden="true"></span>
      <span id="right" class="side" hidden></span>
    </div>
    <div id="list" class="list" hidden></div>
  </main>
  <script src="island.cjs"></script>
</body>
</html>
