<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
/*TOKENS*/
/*COMPONENTS*/
/* Layout only: the panel is a column of header, status card, notice, actions and footer. */
body { width: var(--size-panel); }
#panel { display: flex; flex-direction: column; }
#main { display: flex; flex-direction: column; gap: var(--space-m); padding: var(--space-l) var(--space-l) var(--space-s); }
header { display: flex; align-items: center; gap: var(--space-s); }
header .title { flex: 1; font-weight: var(--weight-strong); white-space: nowrap; }
header .mark { color: var(--accent); }
#notice:empty { display: none; }
#actions { display: flex; flex-direction: column; gap: var(--space-xxs); margin: 0 calc(-1 * var(--space-xs)); }
#rename { margin: var(--space-xs) var(--space-xs); }
.end { display: flex; justify-content: flex-end; gap: var(--space-s); }
footer {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  padding: var(--space-xs) var(--space-s) var(--space-xs) var(--space-l);
  background: var(--surface-footer);
  border-top: 1px solid var(--divider);
}
footer .version { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body class="flyout">
<div id="panel">
  <div id="main" class="rising">
    <header>
      <span class="mark" id="mark"></span>
      <span class="title">Persona Link</span>
      <span class="pill" id="pill"></span>
    </header>
    <div class="card lines" id="lines" aria-live="polite"></div>
    <div id="notice"></div>
    <div id="actions" role="menu"></div>
  </div>
  <footer>
    <span class="version caption secondary" id="version"></span>
    <span id="tools"></span>
  </footer>
</div>
<script type="application/json" id="boot">"__BOOT__"</script>
<script>
/*COMMON*/
/*SCRIPT*/
</script>
</body>
</html>
