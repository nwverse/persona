name: release-pr

# A release is an explicit PR, not a side effect of an ordinary feature merge.
# This workflow never has signing credentials and never publishes a Release.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  plan:
    name: Verify release PR and pin its merge result
    if: >-
      github.event_name == 'push' || startsWith(github.event.pull_request.title, 'release:') &&
      (github.event_name == 'push' || github.event.pull_request.base.ref == 'main') &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'push' || github.event.pull_request.user.login == 'chyroc')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      channel: ${{ steps.source.outputs.channel }}
      pr: ${{ steps.plan.outputs.pr }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      commit: ${{ steps.plan.outputs.commit }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
    steps:
      - name: Resolve and validate the release PR
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" = push ]]; then
            commit="${{ github.sha }}"
            gh api "repos/$REPOSITORY/commits/$commit/pulls" > release-pr-list.json
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          commit=os.environ['COMMIT']
          candidates=[p for p in json.loads(Path('release-pr-list.json').read_text()) if p.get('state')=='closed' and (p.get('merge_commit_sha') or p.get('mergeCommit',{}).get('oid'))==commit and p.get('title','').startswith('release:') and p.get('user',{}).get('login')=='chyroc']
          if len(candidates)!=1:
              print('No unique merged release PR for this main commit; not a release run')
              raise SystemExit(78)
          Path('release-pr.json').write_text(json.dumps(candidates[0]))
          pr=json.loads(Path('release-pr.json').read_text())
          pr['state']='MERGED'
          pr['isDraft']=pr.get('draft',False)
          pr['baseRefName']=pr.get('base',{}).get('ref','main')
          pr['headRefOid']=pr.get('head',{}).get('sha','')
          pr['headRepository']={'nameWithOwner':pr.get('head',{}).get('repo',{}).get('full_name','')}
          pr['author']=pr.get('user',{})
          pr['mergeCommit']={'oid':pr.get('merge_commit_sha')}
          Path('release-pr.json').write_text(json.dumps(pr))
          PY
          else
            gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state,isDraft,baseRefName,headRefOid,headRepository,author,title,mergeCommit > release-pr.json
            gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '{merge_commit_sha}' > release-pr-rest.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          pr=json.loads(Path('release-pr.json').read_text())
          pr['mergeCommit']={'oid':json.loads(Path('release-pr-rest.json').read_text())['merge_commit_sha']}
          Path('release-pr.json').write_text(json.dumps(pr))
          PY
          fi
          printf 'number=%s\n' "$(python3 -c 'import json; print(json.load(open("release-pr.json"))["number"])')" >> "$GITHUB_OUTPUT"
          channel=release
          if [[ "$(python3 -c 'import json; print(json.load(open("release-pr.json"))["title"])')" == *-beta.* ]]; then channel=beta; fi
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          # A PR's proposed merge result, not its possibly stale head or an arbitrary branch.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify PR authorization and create the immutable-source plan
        id: plan
        env:
          REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ steps.source.outputs.channel }}
          PR_NUMBER: ${{ steps.source.outputs.number }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" = push ]]; then
            version="$(python3 scripts/operations/release_pr.py --repository "$REPOSITORY" --channel "$CHANNEL" verify-pr --pr-json release-pr.json --merged --commit "$GIT_COMMIT")"
          else
            version="$(python3 scripts/operations/release_pr.py --repository "$REPOSITORY" --channel "$CHANNEL" verify-pr --pr-json release-pr.json)"
          fi
          python3 scripts/operations/release_pr.py --repository "$REPOSITORY" --channel "$CHANNEL" next-version --version "$version"
          test "$GIT_COMMIT" = "$MERGE_COMMIT"
          mkdir -p release
          python3 scripts/operations/release_pr.py --repository "$REPOSITORY" --channel "$CHANNEL" plan \
            --version "$version" --commit "$GIT_COMMIT" --pr "$PR_NUMBER" --merge-commit "$MERGE_COMMIT" \
            --source-commit "$(python3 -c 'import json; print(json.load(open("release-pr.json"))["headRefOid"])')" --out release/plan.json
          python3 scripts/operations/release_pr.py --repository "$REPOSITORY" --channel "$CHANNEL" check-plan --plan release/plan.json --commit "$GIT_COMMIT"
          {
            printf 'pr=%s\n' "$PR_NUMBER"
            printf 'channel=%s\n' "$CHANNEL"
            printf 'version=%s\n' "$version"
            printf 'tag=v%s\n' "$version"
            printf 'build=%s\n' "$(python3 -c 'import json; print(json.load(open("release/plan.json"))["build"])')"
            printf 'commit=%s\n' "$GIT_COMMIT"
            printf 'source_commit=%s\n' "$(python3 -c 'import json; print(json.load(open("release/plan.json"))["source_commit"])')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-pr-plan-${{ steps.plan.outputs.pr }}-${{ steps.plan.outputs.commit }}
          path: release/plan.json
          if-no-files-found: error
          retention-days: 2

  cli-web:
    name: Build and verify CLI and Web without publishing
    needs: plan
    if: needs.plan.outputs.pr != '0' && needs.plan.outputs.version != ''
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: release-pr-plan-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release
      - name: Verify the complete CLI/Web build from the exact merge result
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NO_DEPLOY: '1'
          RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
          RUSTUP_TOOLCHAIN: '1.98.0'
          PERSONA_RELEASE_BUILD: ${{ needs.plan.outputs.build }}
        run: scripts/release/publish.sh
      - name: Bind the verified downloads to the release plan
        run: |
          set -euo pipefail
          mkdir -p release/downloads
          cd build-publish/bin
          for name in *.gz VERSION SHA256SUMS latest.json install.sh; do
            test -f "$name"
            cp "$name" "$OLDPWD/release/downloads/$name"
          done
          cd "$OLDPWD"
          python3 scripts/operations/release_pr.py --repository "${{ github.repository }}" --channel "${{ needs.plan.outputs.channel }}" bind-cli-web --plan release/plan.json --downloads release/downloads
      - uses: actions/upload-artifact@v4
        with:
          name: release-pr-cli-web-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: |
            release/plan.json
            release/downloads/
          if-no-files-found: error
          retention-days: 2

  android:
    name: Build and sign Android for the exact merge result
    needs: plan
    if: needs.plan.outputs.pr != '0' && needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: persona-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install the reviewed Android SDK, NDK and Rust targets
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools' 'ndk;29.0.14206865'
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.0
          "$HOME/.cargo/bin/rustup" target add --toolchain 1.98.0 aarch64-linux-android x86_64-linux-android
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: release-pr-plan-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release
      - name: Prepare protected Android signing configuration without logging secrets
        env:
          PERSONA_ANDROID_CERTIFICATE_SHA256: ${{ secrets.PERSONA_ANDROID_CERTIFICATE_SHA256 }}
          PERSONA_ANDROID_KEYSTORE_BASE64: ${{ secrets.PERSONA_ANDROID_KEYSTORE_BASE64 }}
          PERSONA_ANDROID_KEY_ALIAS: ${{ secrets.PERSONA_ANDROID_KEY_ALIAS }}
          PERSONA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PERSONA_ANDROID_KEYSTORE_PASSWORD }}
          PERSONA_ANDROID_KEY_PASSWORD: ${{ secrets.PERSONA_ANDROID_KEY_PASSWORD }}
          PERSONA_ANDROID_APPLICATION_ID: ${{ secrets.PERSONA_ANDROID_APPLICATION_ID }}
        run: |
          set -euo pipefail
          python3 scripts/operations/ci_release_config.py android --directory "$RUNNER_TEMP/persona-android"
      - name: Verify tests, R8, versionCode, source and production signature
        env:
          PERSONA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PERSONA_ANDROID_KEYSTORE_PASSWORD }}
          PERSONA_ANDROID_KEY_PASSWORD: ${{ secrets.PERSONA_ANDROID_KEY_PASSWORD }}
          RUSTUP_TOOLCHAIN: '1.98.0'
        run: |
          set -euo pipefail
          python3 scripts/release/android_tag_release.py \
            --config "$RUNNER_TEMP/persona-android/android.json" \
            --worktree "$GITHUB_WORKSPACE" --commit "${{ needs.plan.outputs.commit }}" \
            --version "${{ needs.plan.outputs.version }}" --receipt release/android-receipt.json
      - name: Verify the signed APK and Android index against the release plan
        run: |
          set -euo pipefail
          mkdir -p release/downloads
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          plan=json.loads(Path('release/plan.json').read_text())
          receipt=json.loads(Path('release/android-receipt.json').read_text())
          assert receipt['commit']==plan['commit']
          assert len(receipt['assets'])==2
          for item in receipt['assets']:
              path=Path(item['path'])
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256']
              shutil.copyfile(path,Path('release/downloads')/item['name'])
          index=json.loads(Path('release/downloads/android.json').read_text())
          assert index['version']==plan['version']
          assert index['source_sha']==plan['commit']
          assert index['name'].startswith('Persona-')
          assert index['sha256']==hashlib.sha256(Path('release/downloads',index['name']).read_bytes()).hexdigest()
          Path('release/android-receipt.json').unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-pr-android-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release/downloads/
          if-no-files-found: error
          retention-days: 2

  apple:
    name: Archive and verify iPhone and Watch TestFlight
    needs: [plan, cli-web, android]
    if: needs.plan.outputs.pr != '0' && needs.plan.outputs.version != ''
    runs-on: macos-latest
    timeout-minutes: 180
    environment: persona-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-pr-plan-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-pr-android-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release/downloads
      - name: Install the locked Apple build tools
        run: |
          set -euo pipefail
          brew install xcodegen rustup
          rustup toolchain install 1.98.0 --profile minimal
      - name: Prepare protected App Store Connect configuration without logging secrets
        env:
          PERSONA_APPLE_API_KEY: ${{ secrets.PERSONA_APPLE_API_KEY }}
          PERSONA_APPLE_API_KEY_ID: ${{ secrets.PERSONA_APPLE_API_KEY_ID }}
          PERSONA_APPLE_API_ISSUER: ${{ secrets.PERSONA_APPLE_API_ISSUER }}
          PERSONA_APPLE_APP_ID: ${{ secrets.PERSONA_APPLE_APP_ID }}
          PERSONA_APPLE_TEAM_ID: ${{ secrets.PERSONA_APPLE_TEAM_ID }}
          PERSONA_APP_BUNDLE_ID: ${{ secrets.PERSONA_APP_BUNDLE_ID }}
          PERSONA_APP_GROUP: ${{ secrets.PERSONA_APP_GROUP }}
          PERSONA_WATCH_WIDGET_BUNDLE_ID: ${{ secrets.PERSONA_WATCH_WIDGET_BUNDLE_ID }}
          PERSONA_WATCH_APP_GROUP: ${{ secrets.PERSONA_WATCH_APP_GROUP }}
          PERSONA_TESTFLIGHT_FEEDBACK_EMAIL: ${{ secrets.PERSONA_TESTFLIGHT_FEEDBACK_EMAIL }}
          PERSONA_TESTFLIGHT_EXTERNAL_JSON: ${{ secrets.PERSONA_TESTFLIGHT_EXTERNAL_JSON }}
        run: |
          set -euo pipefail
          python3 scripts/operations/ci_release_config.py apple --directory "$RUNNER_TEMP/persona-apple"
          printf 'PERSONA_CONFIG=%s\n' "$RUNNER_TEMP/persona-apple/config.json" >> "$GITHUB_ENV"
      - name: Archive, export and upload the formal iPhone/Watch build
        env:
          RUSTUP_TOOLCHAIN: '1.98.0'
          NO_PUBLISH: '1'
        run: |
          set -euo pipefail
          build="$(python3 -c 'import json; print(json.load(open("release/plan.json"))["build"])')"
          printf 'PERSONA_TESTFLIGHT_BUILD=%s\n' "$build" >> "$GITHUB_ENV"
          scripts/release/release.sh "$build"
      - name: Wait for VALID and attach Internal/Friends with Beta App Review
        run: python3 scripts/release/asc_testflight.py wait 45 "$PERSONA_TESTFLIGHT_BUILD"
      - name: Read back TestFlight processing and tester state without resubmitting
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/release')
          import asc_testflight as tf
          build=tf.build_by_version(os.environ['PERSONA_TESTFLIGHT_BUILD'])
          assert build and build['attributes']['processingState']=='VALID'
          assert tf.external_state(build)=='IN_BETA_TESTING'
          for name,internal in (('Internal',True),('Friends',False)):
              group=tf.find_group(name,internal)
              assert group
              linked={item['id'] for item in tf.get_all('/v1/betaGroups/'+group['id']+'/builds')}
              assert build['id'] in linked or group['attributes'].get('hasAccessToAllBuilds') is True
          print('TestFlight VALID; Internal/Friends; external IN_BETA_TESTING')
          PY
      - name: Record the store verification without publishing a development IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          plan=json.loads(Path('release/plan.json').read_text())
          plan['stores']={'iphone_watch':{'build':os.environ['PERSONA_TESTFLIGHT_BUILD'],'processing':'VALID','groups':['Internal','Friends'],'external':'IN_BETA_TESTING'}}
          Path('release/plan.json').write_text(json.dumps(plan,indent=2)+'\n')
          Path('release/store-verified.json').write_text(json.dumps(plan['stores'])+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-pr-apple-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: |
            release/plan.json
            release/store-verified.json
          if-no-files-found: error
          retention-days: 2

  windows:
    name: Verify Windows programs natively and sign the desktop package
    needs: [plan, cli-web, android, apple]
    if: needs.plan.outputs.pr != '0' && needs.plan.outputs.version != ''
    runs-on: windows-latest
    timeout-minutes: 120
    environment: persona-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-pr-cli-web-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-pr-android-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release/downloads
      - uses: actions/download-artifact@v4
        with:
          name: release-pr-apple-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release
      - name: Run every Windows CLI on its matching native architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = Get-Content release/plan.json -Raw | ConvertFrom-Json
          python -B scripts/operations/windows_release.py --archive release/downloads/persona-link-windows-amd64.exe.gz --version $plan.version --build $plan.build
          python -B scripts/operations/windows_release.py --archive release/downloads/personad-windows-amd64.exe.gz --version $plan.version --build $plan.build
          python -B scripts/operations/windows_release.py --archive release/downloads/persona-node-windows-amd64.exe.gz --version $plan.version --build $plan.build
      - name: Verify the combined receipt and native Windows reports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = Get-Content release/plan.json -Raw | ConvertFrom-Json
          $assets = @()
          foreach ($path in Get-ChildItem release/downloads -File) {
            $assets += @{path=$path.FullName; name=$path.Name; sha256=(Get-FileHash $path.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          $assets += @{path=(Resolve-Path release/downloads/persona-link-windows-amd64.verification.json).Path; name='persona-link-windows-amd64.verification.json'; sha256=(Get-FileHash release/downloads/persona-link-windows-amd64.verification.json -Algorithm SHA256).Hash.ToLowerInvariant()}
          $assets += @{path=(Resolve-Path release/downloads/personad-windows-amd64.verification.json).Path; name='personad-windows-amd64.verification.json'; sha256=(Get-FileHash release/downloads/personad-windows-amd64.verification.json -Algorithm SHA256).Hash.ToLowerInvariant()}
          $assets += @{path=(Resolve-Path release/downloads/persona-node-windows-amd64.verification.json).Path; name='persona-node-windows-amd64.verification.json'; sha256=(Get-FileHash release/downloads/persona-node-windows-amd64.verification.json -Algorithm SHA256).Hash.ToLowerInvariant()}
          @{commit=$plan.commit; assets=$assets} | ConvertTo-Json -Depth 5 | Set-Content release/receipt.json -NoNewline
          python -B -c "import sys; sys.path.insert(0, 'scripts/operations'); from windows_release import check_windows_artifacts; import json; data=json.load(open('release/receipt.json')); check_windows_artifacts(data['assets'], '$($plan.version)')"
          python scripts/operations/release_pr.py --repository '${{ github.repository }}' --channel '${{ needs.plan.outputs.channel }}' verify-artifacts --plan release/plan.json --commit '${{ needs.plan.outputs.commit }}' --add release/downloads
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build the signed Windows desktop package for the immutable version
        shell: bash
        env:
          PERSONA_DESKTOP_VERSION: ${{ needs.plan.outputs.version }}
          PERSONA_DESKTOP_REQUIRE_SIGNING: '1'
          PERSONA_DESKTOP_APP_ID: ${{ secrets.PERSONA_DESKTOP_APP_ID }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: scripts/ci/desktop-package.sh win
      - name: Verify Authenticode and beta/stable updater metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem desktop/release/*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw 'Windows desktop is not Authenticode-signed' }
          $metadata = if ('${{ needs.plan.outputs.channel }}' -eq 'beta') { 'beta.yml' } else { 'latest.yml' }
          if (-not (Test-Path "desktop/release/$metadata")) { throw "Missing $metadata" }
          Copy-Item "desktop/release/$metadata" "release/downloads/$metadata"
      - name: Collect signed desktop and native verification receipts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item desktop/release/*.exe release/downloads/
          Copy-Item desktop/release/*.blockmap release/downloads/
      - uses: actions/upload-artifact@v4
        with:
          name: release-pr-windows-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release/downloads/
          if-no-files-found: error
          retention-days: 2

  verify:
    name: All available release-PR checks passed
    needs: [plan, cli-web, android, apple, windows]
    if: needs.plan.outputs.pr != '0' && needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-pr-plan-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-pr-cli-web-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-pr-android-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release/downloads
      - uses: actions/download-artifact@v4
        with:
          name: release-pr-apple-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-pr-windows-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release/downloads
      - name: Check the final verified plan
        env:
          REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          python3 scripts/operations/release_pr.py --repository "$REPOSITORY" --channel "$CHANNEL" verify-artifacts --plan release/plan.json --commit "$COMMIT" --add release/downloads
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('release/plan.json').read_text())
          store=plan['stores']['iphone_watch']
          assert store['build']==str(plan['build'])
          assert store['processing']=='VALID'
          assert store['groups']==['Internal','Friends']
          assert store['external']=='IN_BETA_TESTING'
          assert json.loads(Path('release/store-verified.json').read_text())==plan['stores']
          print('All CLI/Web, Android and iPhone/Watch release-PR checks passed')
          PY
      - name: Record explicit platform prerequisites without treating them as passed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('release/plan.json').read_text())
          plan['platforms']={
              'hub_cli_web':'verified from the exact source',
              'android':'signed release APK verified',
              'iphone_watch':'TestFlight VALID, Internal/Friends, IN_BETA_TESTING',
              'windows_amd64':'verified natively with Authenticode',
              'windows_arm64':'blocked: matching native ARM64 runner required',
              'harmonyos':'blocked: DevEco and production signing required (#6734)',
          }
          Path('release/plan.json').write_text(json.dumps(plan,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-pr-verified-${{ needs.plan.outputs.pr }}-${{ needs.plan.outputs.commit }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Merge the verified release PR for post-merge verification
    needs: [plan, verify]
    if: github.event_name == 'pull_request' && github.actor == 'chyroc' && github.triggering_actor == 'chyroc'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: persona-release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Squash the exact verified PR head, then require the main merge to be verified again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.plan.outputs.pr }}
          HEAD: ${{ needs.plan.outputs.source_commit }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state,isDraft,baseRefName,headRefOid,headRepository,author,title,mergeCommit > release/merge-pr.json
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '{merge_commit_sha}' > release/merge-pr-rest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          pr=json.loads(Path('release/merge-pr.json').read_text())
          pr['mergeCommit']={'oid':json.loads(Path('release/merge-pr-rest.json').read_text())['merge_commit_sha']}
          Path('release/merge-pr.json').write_text(json.dumps(pr))
          PY
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          pr=json.loads(Path('release/merge-pr.json').read_text())
          assert pr['state']=='OPEN' and pr['isDraft'] is False
          assert pr['baseRefName']=='main' and pr['headRefOid']==os.environ['HEAD']
          assert pr['headRepository']['nameWithOwner']==os.environ['REPOSITORY']
          assert pr['author']['login']=='chyroc'
          assert pr['title'].startswith('release:')
          assert pr['mergeCommit']['oid']
          PY
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --match-head-commit "$HEAD" --subject "$(python3 -c 'import json; print(json.load(open("release/merge-pr.json"))["title"])') (#$PR_NUMBER)"
