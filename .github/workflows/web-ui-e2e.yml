name: Web UI E2E

on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Optional Playwright grep filter (empty runs all P0 specs)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: web-ui-e2e-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  web-ui-e2e:
    name: Web P0 UI stability suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Playwright Chromium
        run: cd web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run Web UI E2E
        env:
          UI_E2E_GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$UI_E2E_GREP" ]; then
            scripts/ci/web-ui-e2e.sh --grep "$UI_E2E_GREP"
          else
            scripts/ci/web-ui-e2e.sh
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-web-ui-e2e-results
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
