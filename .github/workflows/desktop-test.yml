name: Desktop CI

on:
  workflow_call:
    inputs:
      signed:
        description: 'Sign and notarize release artifacts using repository secrets'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      signed:
        description: 'Sign and notarize release artifacts using repository secrets'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Desktop checks
        run: scripts/ci/desktop.sh

  macos:
    name: macOS universal package
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Desktop checks
        run: scripts/ci/desktop.sh
      - name: Build web for the desktop smoke hub
        run: npm --prefix web ci && npm --prefix web run build
      - name: macOS Electron smoke
        env:
          MOCK_WEB: web/dist
          PERSONA_DESKTOP_SMOKE: desktop/release/smoke
        run: npm --prefix desktop run build && node desktop/scripts/smoke-with-hub.mjs
      - name: Build universal macOS packages
        env:
          PERSONA_DESKTOP_APP_ID: com.example.persona.desktop
          CSC_LINK: ${{ inputs.signed && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ inputs.signed && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ inputs.signed && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.signed && secrets.APPLE_API_ISSUER || '' }}
        run: scripts/ci/desktop-package.sh mac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-desktop-macos-smoke
          path: desktop/release/smoke
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: persona-desktop-macos${{ inputs.signed && '-signed' || '-unsigned' }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*-mac.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows package and smoke test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Desktop checks
        shell: bash
        run: scripts/ci/desktop.sh
      - name: Build web for the desktop smoke hub
        shell: bash
        run: npm --prefix web ci && npm --prefix web run build
      - name: Windows Electron smoke
        shell: bash
        env:
          MOCK_WEB: web/dist
          PERSONA_DESKTOP_SMOKE: desktop/release/smoke
        run: npm --prefix desktop run build && node desktop/scripts/smoke-with-hub.mjs
      - name: Build Windows NSIS
        shell: bash
        env:
          PERSONA_DESKTOP_APP_ID: com.example.persona.desktop
          CSC_LINK: ${{ inputs.signed && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: scripts/ci/desktop-package.sh win
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-desktop-windows-smoke
          path: desktop/release/smoke
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: persona-desktop-windows${{ inputs.signed && '-signed' || '-unsigned' }}
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 7
