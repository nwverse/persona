name: Desktop CI

on:
  # Signing belongs only to the administrator-gated release workflow. Development and pull-request checks build
  # unsigned artifacts, so this workflow never receives a certificate or a notarization key.
  workflow_call:
  workflow_dispatch:
    inputs:
      acceptance:
        description: 'full: desktop checks and update installation; first-run: Linux packaged sandbox gate only'
        type: choice
        options: [full, first-run]
        default: full

permissions:
  contents: read

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-latest
    env:
      FIRST_RUN_ONLY: ${{ inputs.acceptance == 'first-run' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Desktop checks
        if: ${{ !cancelled() && env.FIRST_RUN_ONLY != 'true' }}
        run: scripts/ci/desktop.sh
      # The acceptance smoke loads the built web client the way the hub serves it. It is built once here (its sign-in
      # module needs Go) and handed to the macOS and Windows jobs, which need neither Go nor the web's dependencies.
      - name: Build the web client for the desktop smoke
        run: scripts/ci/desktop-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: persona-desktop-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1
      - name: Linux Electron acceptance smoke (headless)
        if: ${{ !cancelled() && env.FIRST_RUN_ONLY != 'true' }}
        run: scripts/ci/desktop-smoke.sh
      - name: Install desktop dependencies for the packaged first-run
        if: ${{ !cancelled() }}
        run: npm --prefix desktop ci --ignore-scripts
      - name: Build the unsigned Linux package
        if: ${{ !cancelled() }}
        run: scripts/ci/desktop-first-run-package.sh
      - name: Record AppArmor diagnostics before loading
        id: diagnostics-before
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: scripts/ci/desktop-first-run-apparmor-diagnostics.sh before-load
      - name: Load the run-scoped Chromium user-namespace profile
        id: sandbox-load
        if: ${{ !cancelled() }}
        run: scripts/ci/desktop-first-run-apparmor.sh load
      # Record exactly one outcome after the real first-run test. Cleanup cannot replace this result.
      - name: Linux packaged first-run acceptance (headless)
        id: first-run
        if: ${{ !cancelled() && steps.sandbox-load.outcome == 'success' }}
        continue-on-error: true
        env:
          PERSONA_DESKTOP_TEST_PACKAGE: ${{ github.workspace }}/desktop/release/linux-unpacked/persona-desktop
        run: xvfb-run -a scripts/ci/desktop-first-run.sh desktop/release/first-run
      - name: Record AppArmor diagnostics after loading
        id: diagnostics-loaded
        if: ${{ always() && steps.sandbox-load.outcome != 'skipped' }}
        continue-on-error: true
        run: scripts/ci/desktop-first-run-apparmor-diagnostics.sh after-load
      - name: Record the packaged first-run result
        id: first-run-result
        if: ${{ always() && steps.sandbox-load.outcome == 'success' }}
        continue-on-error: true
        env:
          FIRST_RUN_OUTCOME: ${{ steps.first-run.outcome }}
        run: |
          if [ "$FIRST_RUN_OUTCOME" = success ]; then
            scripts/ci/desktop-first-run-apparmor.sh first-run-ok
          else
            scripts/ci/desktop-first-run-apparmor.sh first-run-failed
          fi
      - name: Remove the run-scoped Chromium profile
        id: sandbox-cleanup
        if: ${{ always() && steps.sandbox-load.outcome != 'skipped' && steps.first-run-result.outcome != 'skipped' && steps.first-run-result.outcome != 'cancelled' }}
        continue-on-error: true
        env:
          FIRST_RUN_OUTCOME: ${{ steps.first-run.outcome }}
          FIRST_RUN_RECORD_OUTCOME: ${{ steps.first-run-result.outcome }}
        run: |
          if [ "$FIRST_RUN_RECORD_OUTCOME" = success ]; then
            scripts/ci/desktop-first-run-apparmor.sh cleanup
          else
            scripts/ci/desktop-first-run-apparmor.sh cleanup-owned
          fi
      - name: Record AppArmor diagnostics after cleanup
        id: diagnostics-cleanup
        if: ${{ always() && steps.sandbox-cleanup.outcome != 'skipped' }}
        continue-on-error: true
        run: scripts/ci/desktop-first-run-apparmor-diagnostics.sh after-cleanup
      - name: Preserve sandbox receipts
        if: ${{ always() && steps.sandbox-load.outcome != 'skipped' }}
        env:
          DIAGNOSTIC_PHASE: ${{ steps.diagnostics-cleanup.outcome != 'skipped' && 'after-cleanup' || steps.diagnostics-loaded.outcome != 'skipped' && 'after-load' || 'before-load' }}
        run: |
          destination="$RUNNER_TEMP/persona-first-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$destination"
          diagnostics="$RUNNER_TEMP/persona-first-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.diagnostics"
          if [ -d "$diagnostics" ]; then
            cp -R -- "$diagnostics" "$destination/diagnostics-$DIAGNOSTIC_PHASE"
          fi
          for suffix in run.json cleanup.json apparmor policy ownership; do
            if [ -f "$RUNNER_TEMP/persona-first-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.$suffix" ]; then
              cp -- "$RUNNER_TEMP/persona-first-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.$suffix" "$destination/$suffix"
            fi
          done
      - name: Enforce packaged first-run and sandbox cleanup verdicts
        if: ${{ always() && steps.sandbox-load.outcome != 'skipped' }}
        env:
          LOAD_OUTCOME: ${{ steps.sandbox-load.outcome }}
          FIRST_RUN_OUTCOME: ${{ steps.first-run.outcome }}
          RECORD_OUTCOME: ${{ steps.first-run-result.outcome }}
          CLEANUP_OUTCOME: ${{ steps.sandbox-cleanup.outcome }}
          DIAGNOSTICS_BEFORE_OUTCOME: ${{ steps.diagnostics-before.outcome }}
          DIAGNOSTICS_LOADED_OUTCOME: ${{ steps.diagnostics-loaded.outcome }}
          DIAGNOSTICS_CLEANUP_OUTCOME: ${{ steps.diagnostics-cleanup.outcome }}
        run: |
          if [ "$DIAGNOSTICS_BEFORE_OUTCOME" != success ] || [ "$DIAGNOSTICS_LOADED_OUTCOME" != success ] || [ "$DIAGNOSTICS_CLEANUP_OUTCOME" != success ]; then
            printf 'read-only diagnostics failed: before=%s loaded=%s cleanup=%s\n' "$DIAGNOSTICS_BEFORE_OUTCOME" "$DIAGNOSTICS_LOADED_OUTCOME" "$DIAGNOSTICS_CLEANUP_OUTCOME" >&2
            exit 1
          fi
          if [ "$LOAD_OUTCOME" != success ]; then
            printf 'sandbox load failed: %s\n' "$LOAD_OUTCOME" >&2
            exit 1
          fi
          if [ "$FIRST_RUN_OUTCOME" != success ] || [ "$RECORD_OUTCOME" != success ] || [ "$CLEANUP_OUTCOME" != success ]; then
            printf 'first-run verdict failed: first-run=%s record=%s cleanup=%s\n' "$FIRST_RUN_OUTCOME" "$RECORD_OUTCOME" "$CLEANUP_OUTCOME" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.sandbox-load.outcome != 'skipped' }}
        with:
          name: persona-desktop-linux-first-run-apparmor
          path: ${{ runner.temp }}/persona-first-run-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.first-run.outcome != 'skipped' }}
        with:
          name: persona-desktop-linux-first-run
          path: desktop/release/first-run
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.FIRST_RUN_ONLY != 'true' }}
        with:
          name: persona-desktop-linux-smoke
          path: desktop/release/smoke
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS universal package
    needs: linux
    # Runs even when the Linux smoke failed, so each platform reports its own verdict; without the web client its
    # download step fails.
    if: ${{ !cancelled() && inputs.acceptance != 'first-run' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Desktop checks
        run: scripts/ci/desktop.sh
      - uses: actions/download-artifact@v4
        with:
          name: persona-desktop-web-dist
          path: web/dist
      - name: macOS Electron acceptance smoke
        run: scripts/ci/desktop-smoke.sh
      - name: Build universal macOS packages
        if: ${{ !cancelled() && inputs.acceptance != 'first-run' }} # the package and the smoke report separately
        env:
          PERSONA_DESKTOP_APP_ID: com.example.persona.desktop
        run: scripts/ci/desktop-package.sh mac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-desktop-macos-smoke
          path: desktop/release/smoke
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && inputs.acceptance != 'first-run' }}
        with:
          name: persona-desktop-macos-unsigned
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*-mac.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows package and smoke test
    needs: linux
    if: ${{ !cancelled() && inputs.acceptance != 'first-run' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Desktop checks
        shell: bash
        run: scripts/ci/desktop.sh
      - uses: actions/download-artifact@v4
        with:
          name: persona-desktop-web-dist
          path: web/dist
      - name: Windows Electron acceptance smoke
        shell: bash
        run: scripts/ci/desktop-smoke.sh
      - name: Build Windows NSIS
        if: ${{ !cancelled() && inputs.acceptance != 'first-run' }}
        shell: bash
        env:
          PERSONA_DESKTOP_APP_ID: com.example.persona.desktop
        run: scripts/ci/desktop-package.sh win
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-desktop-windows-smoke
          path: desktop/release/smoke
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && inputs.acceptance != 'first-run' }}
        with:
          name: persona-desktop-windows-unsigned
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 7

  # A real update with no certificate and no published release: the packaged old version finds, downloads and
  # verifies a new one from a feed served on the runner (desktop/scripts/update-test.mjs).
  update:
    name: Update from a local feed (${{ matrix.name }})
    if: ${{ !cancelled() && inputs.acceptance != 'first-run' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        shell: bash
        run: npm --prefix desktop ci --ignore-scripts
      - name: Update test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node desktop/scripts/update-test.mjs desktop/release/update-test/result
          else
            node desktop/scripts/update-test.mjs desktop/release/update-test/result
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-desktop-update-test-${{ matrix.name }}
          path: desktop/release/update-test/result
          if-no-files-found: error
          retention-days: 7
