name: hub image
on:
  # Release publication only: Docker installs use the version/latest images.
  # No branch push, pull request, merge group, or schedule starts this workflow.
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hub-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Image version
        run: scripts/ci/hub-image.sh version
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: persona-hub:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            IMAGE=${{ steps.version.outputs.image }}
            NODE_PLATFORMS=linux/amd64
          cache-from: type=gha,scope=hub
          cache-to: type=gha,scope=hub,mode=max,timeout=2m,ignore-error=true
      - name: Isolated Compose smoke
        env:
          CI_IMAGE_VERSION: ${{ steps.version.outputs.version }}
          CI_IMAGE_PREBUILT: '1'
        run: scripts/ci/hub-image.sh
  publish:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ needs.smoke.outputs.image }}
          flavor: latest=false
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.smoke.outputs.version }}
            IMAGE=${{ needs.smoke.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,scope=hub,mode=max,timeout=2m,ignore-error=true
