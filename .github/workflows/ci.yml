name: CI
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Repository guards and path selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      server: ${{ steps.paths.outputs.server }}
      web: ${{ steps.paths.outputs.web }}
      android: ${{ steps.paths.outputs.android }}
      apple: ${{ steps.paths.outputs.apple }}
      runtimes: ${{ steps.paths.outputs.runtimes }}
      scripts: ${{ steps.paths.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Repository guards
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: scripts/ci/guards.sh
      - id: paths
        name: Select platforms
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; then
            python3 scripts/ci/paths.py
          else
            python3 scripts/ci/paths.py --all
          fi
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/server-test.yml
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web-test.yml
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android-test.yml
  apple:
    name: iOS and Watch
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    uses: ./.github/workflows/apple-test.yml
    with:
      lane: ios
  apple_macos:
    name: Mac (non-blocking)
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    uses: ./.github/workflows/apple-test.yml
    with:
      lane: macos
  runtimes:
    needs: changes
    if: needs.changes.outputs.runtimes == 'true'
    uses: ./.github/workflows/runtimes-test.yml
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    uses: ./.github/workflows/scripts-tests.yml
  # By maintainer decision, Mac runs and reports its real result independently
  # but temporarily does not block merging. Never mask it with continue-on-error.
  required:
    name: CI required
    needs: [changes, server, web, android, apple, runtimes, scripts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify selected platform results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/required.py
